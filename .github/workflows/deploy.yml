# Builds and checks the site on every PR and push to main; deploys to Cloudflare Workers only from main.
# The CI-built resume PDF (ubuntu-24.04 + LibreOffice + Liberation fonts) is the only one ever published.
# Design: docs/design-doc.md §13.3.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily rebuild to pick up GitHub project changes (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check `build` in the main ruleset (README "Contributing and deploy
  # flow"). Renaming it, or adding a `name:`, changes the check name and breaks the ruleset.
  build:
    runs-on: ubuntu-24.04
    # A normal run takes 3–5 minutes; cap a stuck run (default is 6 hours) to save CI minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install LibreOffice and Liberation fonts
        # Retries and a per-request timeout so a slow Ubuntu mirror doesn't stall the job.
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 libreoffice-writer fonts-liberation

      - name: Check Arial resolves to Liberation Sans
        run: |
          match="$(fc-match Arial)"
          echo "fc-match Arial: $match"
          case "$match" in
            *'"Liberation Sans"'*) ;;
            *) echo "::error::Arial must resolve to Liberation Sans for the resume PDF to match the design."; exit 1 ;;
          esac
          soffice --version

      - run: npm ci

      - name: Build (resume, projects, site)
        run: npm run build
        env:
          CV_PHONE: ${{ secrets.CV_PHONE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the doodle test build (dist-doodle/, never deployed)
        # Task F.4: astro build only, with a forced doodle (pi-day), into dist-doodle/ for npm run check and the
        # doodle e2e tests. It reuses the build above's outputs. The deploy below still reads dist/ (wrangler.jsonc).
        run: npm run doodle:build

      - name: Upload resume PDF
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: dist/resume.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Check (types, lint, tests, phone checks, format)
        run: npm run check
        env:
          CV_PHONE: ${{ secrets.CV_PHONE }}

      - name: Install Chromium for Playwright
        # Same apt retries/timeout as the LibreOffice step, for the apt calls --with-deps makes. Headless
        # runs only use the headless shell, so the full Chromium isn't installed.
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries
          npx playwright install --with-deps --only-shell chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
